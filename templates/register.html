{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-3">Register</h3>
                <div id="registerMessage" class="alert d-none"></div>
                <form id="registerForm">
                    <input
                        type="text"
                        id="username"
                        class="form-control mb-3"
                        placeholder="Username"
                        required>
                    <input
                        type="email"
                        id="email"
                        class="form-control mb-3"
                        placeholder="Email"
                        required>
                    <div class="input-group mb-3">
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()">
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            id="captchaQuestion">
                            Loading CAPTCHA...
                        </label>

                        <input
                            type="number"
                            id="captchaAnswer"
                            class="form-control"
                            placeholder="Enter the answer"
                            required>

                        <small class="text-muted">
                            Please solve the math problem to continue.
                        </small>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">Register
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
