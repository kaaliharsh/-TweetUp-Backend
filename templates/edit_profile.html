{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">

        <h3>Edit Profile</h3>

    </div>

    <div class="card-body">

        <form id="profileForm">

            <div class="mb-3">

                <label>
                    Bio
                </label>

                <textarea
                    id="bioInput"
                    class="form-control"
                    rows="4">
                </textarea>

            </div>

            <div class="mb-3">

                <label>
                    Profile Picture
                </label>

                <input
                    type="file"
                    id="profilePictureInput"
                    class="form-control">

            </div>

            <button
                class="btn btn-success"
                type="submit">

                Save Profile

            </button>

        </form>

    </div>

</div>

{% endblock %}
