{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>TweetUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>
<script src="{% static 'js/navbar.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/feed.js' %}"></script>
<script src="{% static 'js/tweets.js' %}"></script>
<script src="{% static 'js/profile.js' %}"></script>
<script src="{% static 'js/public_profile.js' %}"></script>
<script src="{% static 'js/search.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            TweetUp
        </a>

        <div>

            <a href="/" class="btn btn-light me-2">
                Feed
            </a>

            <a href="/create-tweet-page/"
               id="createTweetNav"
               class="btn btn-success me-2 d-none">
                Create Tweet
            </a>

            <a href="/search-users-page/"
               id="searchNav"
               class="btn btn-info me-2 d-none">
                Search Users
            </a>

            <a href="/profile-page/"
               id="profileNav"
               class="btn btn-light me-2 d-none">
                Profile
            </a>

            <a href="/login-page/"
               id="loginNav"
               class="btn btn-primary me-2">
                Login
            </a>

            <a href="/register-page/"
               id="registerNav"
               class="btn btn-warning me-2">
                Register
            </a>

            <button
                id="logoutNav"
                onclick="logoutUser()"
                class="btn btn-danger d-none">
                Logout
            </button>

        </div>

    </div>
</nav>
<div class="container mt-4">
    {% block content %}

    {% endblock %}
</div>
</body>
</html>
