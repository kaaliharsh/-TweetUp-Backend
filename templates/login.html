{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <h3>Login</h3>
            </div>

            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Username</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            required>
                    </div>
                    <div class="input-group mb-3">
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="togglePassword()">

                            <i id="eyeIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="errorMessage"

                        class="alert alert-danger d-none">

                </div>
                <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            id="captchaQuestion">
                            Loading CAPTCHA...
                        </label>

                        <input
                            type="number"
                            id="captchaAnswer"
                            class="form-control"
                            placeholder="Enter the answer"
                            required>

                        <small class="text-muted">
                            Please solve the math problem to continue.
                        </small>

                    </div>
                    <button
                        type="submit"
                        class="btn btn-primary">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
