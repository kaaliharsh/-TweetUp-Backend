{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">

        <h3>Search Users</h3>

    </div>

    <div class="card-body">

        <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Enter username">

        <button
            class="btn btn-primary mt-3"
            onclick="searchUsers()">

            Search

        </button>

        <div
            id="searchResults"
            class="mt-4">

        </div>

    </div>

</div>

{% endblock %}
